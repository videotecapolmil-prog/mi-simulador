<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Exámenes Dinámico</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background-color: #f5f7fb; color: #333; }
        h1 { text-align: center; color: #0070f3; }
        .card { background: white; border: 1px solid #e1e8ed; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .pregunta-bloque { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #eaeaea; }
        label { display: block; margin: 8px 0; cursor: pointer; padding: 6px; border-radius: 4px; }
        label:hover { background-color: #f0f7ff; }
        input[type="radio"] { margin-right: 10px; }
        button { display: block; width: 100%; background: #0070f3; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0051a8; }
        #resultado { text-align: center; font-size: 20px; margin-top: 20px; color: #0070f3; }
    </style>
</head>
<body>

    <h1>Simulador de Exámenes</h1>
    <div class="card">
        <div id="contenedor-quiz">
            <p>Cargando preguntas aleatorias...</p>
        </div>
        <button onclick="revisarRespuestas()">Enviar Examen</button>
        <h3 id="resultado"></h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
